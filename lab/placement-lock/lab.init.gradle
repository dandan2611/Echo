// Opt-in diagnostics only: ./gradlew -I lab/placement-lock/lab.init.gradle :core:lockLab
allprojects {
    if (name == 'core') {
        afterEvaluate {
            configurations.testRuntimeClasspath.resolutionStrategy.force(
                'org.redisson:redisson:' + System.getProperty('lab.redisson', '3.29.0'))
            def lab = sourceSets.create('lockLab') {
                java.srcDir(rootProject.file('lab/placement-lock/src'))
                compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
                runtimeClasspath += output + compileClasspath
            }
            tasks.register('lockLab', JavaExec) {
                dependsOn tasks.named('lockLabClasses')
                classpath = lab.runtimeClasspath
                mainClass = 'fr.codinbox.echo.core.server.placement.' + System.getProperty('lab.main', 'LockLab')
                args System.getProperty('lab.mode', 'baseline'),
                    System.getProperty('lab.pause', 'false'),
                    System.getProperty('lab.timings', 'fast')
            }
        }
    }
}
