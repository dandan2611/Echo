minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit]
exclude: '^(server|run|logs)/|(^|/)(build|bin|dist|node_modules|__pycache__|\.git|\.gradle|\.venv|\.terraform|\.build|\.tools)/|\.tfstate|\.pivot\.json$|(^|/)gradlew$'
repos:
  - repo: local
    hooks:
      - id: spotless
        name: Palantir Java Format and Gradle formatting
        language: python
        entry: python .formatting/spotless.py
        files: '\.java$|\.gradle(\.kts)?$'
        exclude: '^\.formatting/'
        require_serial: true
      - id: java-policy
        name: JetBrains nullability and explicit this
        language: python
        entry: python .formatting/java_policy.py
        files: '\.java$'
        exclude: '^\.formatting/'
        require_serial: true
      - id: prettier
        name: Prettier (YAML, JSON, Markdown)
        language: node
        additional_dependencies: [prettier@3.9.9]
        entry: prettier --write --ignore-unknown
        files: '\.(json|jsonc|ya?ml|md)$'
      - id: ruff-format
        name: Ruff format
        language: python
        additional_dependencies: [ruff==0.16.9]
        entry: ruff format
        types_or: [python, pyi]
      - id: shfmt
        name: shfmt (including extensionless scripts)
        language: python
        additional_dependencies: [shfmt-py==4.2.0]
        entry: shfmt -w -i 2 -ci -bn
        types: [shell]
